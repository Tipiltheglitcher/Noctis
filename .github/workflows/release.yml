name: Build & Release Noctis (PC + Android)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'PC/package-lock.json'

      - name: Install PC dependencies
        working-directory: PC
        run: npm ci

      - name: Build Windows NSIS Setup.exe
        working-directory: PC
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run typecheck
          npm run dist

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: PC/release/*-Setup.exe

  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'Mobile/package-lock.json'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Mobile dependencies & sync Capacitor
        working-directory: Mobile
        run: |
          npm ci
          npm run typecheck
          npm run cap:sync

      - name: Prepare Android release keystore
        env:
          KS_B64: ${{ secrets.NOCTIS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "${{ runner.temp }}/noctis-release.jks"
          fi

      - name: Build Android APK
        working-directory: Mobile/android
        env:
          NOCTIS_KEYSTORE_PATH: ${{ runner.temp }}/noctis-release.jks
          NOCTIS_KEYSTORE_PASS: ${{ secrets.NOCTIS_KEYSTORE_PASS }}
          NOCTIS_KEY_ALIAS: ${{ secrets.NOCTIS_KEY_ALIAS }}
          NOCTIS_KEY_PASS: ${{ secrets.NOCTIS_KEY_PASS }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          IFS='.' read -r MAJ MIN PAT <<< "$VERSION"
          export NOCTIS_VERSION_NAME="$VERSION"
          export NOCTIS_VERSION_CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew assembleRelease
          mkdir -p ../release
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_SRC" "../release/Noctis-${VERSION}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Mobile/release/*.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-assets

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ls -la release-assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            cat <<'EOF' > release-notes.md
            Première version publique de **Noctis** pour Windows (`Setup.exe`) et Android (`.apk`).

            - Connexion **Lycée Connecté / ÉduConnect** automatique + **QR Code**
            - Emploi du temps avec pop-up de cours complète (contenu de séance, fichiers, devoirs liés)
            - Informations & Sondages compatibles PRONOTE 2026 (avec réponses interactives)
            - Cantine séparée **Midi** et **Soir · Internat**
            - Notes, courbes & **Simulateur de moyenne**
            - Vérification automatique des mises à jour via GitHub Releases
            EOF
            gh release create "$TAG" release-assets/* \
              --title "Noctis $TAG" \
              --notes-file release-notes.md
          fi
