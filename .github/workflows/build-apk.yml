name: Build Android APK (Artifact Only)

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'Mobile/package-lock.json'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Mobile dependencies & sync Capacitor
        working-directory: Mobile
        run: |
          npm ci
          npm run typecheck
          npm run cap:sync

      - name: Prepare Android release keystore
        env:
          KS_B64: ${{ secrets.NOCTIS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "${{ runner.temp }}/noctis-release.jks"
          fi

      - name: Build signed Android APK
        working-directory: Mobile/android
        env:
          NOCTIS_KEYSTORE_PATH: ${{ runner.temp }}/noctis-release.jks
          NOCTIS_KEYSTORE_PASS: ${{ secrets.NOCTIS_KEYSTORE_PASS }}
          NOCTIS_KEY_ALIAS: ${{ secrets.NOCTIS_KEY_ALIAS }}
          NOCTIS_KEY_PASS: ${{ secrets.NOCTIS_KEY_PASS }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          IFS='.' read -r MAJ MIN PAT <<< "$VERSION"
          export NOCTIS_VERSION_NAME="$VERSION"
          export NOCTIS_VERSION_CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew assembleRelease
          mkdir -p ../release
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_SRC" "../release/Noctis-${VERSION}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Mobile/release/*.apk
